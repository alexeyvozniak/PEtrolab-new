name: Windows test build

on:
  push:
    branches: [main, codex/petrolab-2-release]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}\\src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Enable Rust stable
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Validate Python contracts and import core
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --disable-pip-version-check .
          python scripts/validate_contracts.py
          python -m unittest discover -s tests
      - name: Build Windows scientific service
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --disable-pip-version-check pyinstaller
          python scripts/build_windows_service.py
          python scripts/qa_packaged_import.py
          $request = @{ protocol_version = "1.0"; request_id = [guid]::NewGuid().ToString(); command = "import.inspect_source"; payload = @{ source_path = (Resolve-Path "fixtures/import/m1_1_ambiguous_multisheet.xlsx").Path } } | ConvertTo-Json -Compress
          $response = $request | & .\desktop\src-tauri\binaries\petrolab-service.exe | ConvertFrom-Json
          if ($null -eq $response.result.source_fingerprint) { throw "Packaged service did not return import inspection." }
          $database = Join-Path $env:RUNNER_TEMP "petrolab-packaged-smoke.sqlite"
          $dbRequest = @{ protocol_version = "1.0"; request_id = [guid]::NewGuid().ToString(); command = "project.analyses.list"; payload = @{ project_database_path = $database; limit = 10 } } | ConvertTo-Json -Compress
          $dbResponse = $dbRequest | & .\desktop\src-tauri\binaries\petrolab-service.exe | ConvertFrom-Json
          if ($null -ne $dbResponse.error) { throw "Packaged service could not open project database: $($dbResponse.error.message)" }
          if ($dbResponse.result.total -ne 0) { throw "Fresh packaged project database must be empty." }
          if (-not (Test-Path $database)) { throw "Packaged service did not create the SQLite project database." }
          @'
          import json
          import subprocess
          import uuid
          from pathlib import Path

          executable = Path("desktop/src-tauri/binaries/petrolab-service.exe")
          request = {
              "protocol_version": "1.0",
              "request_id": str(uuid.uuid4()),
              "command": "import.inspect_source",
              "payload": {"source_path": r"C:\тест PetroLab\нет файла.xlsx"},
          }
          completed = subprocess.run(
              [str(executable)],
              input=(json.dumps(request, ensure_ascii=False) + "\n").encode("utf-8"),
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              check=True,
          )
          decoded = completed.stdout.decode("utf-8", errors="strict")
          response = json.loads(decoded.splitlines()[0])
          observed = response["error"]["details"]["path"]
          if "тест PetroLab" not in observed:
              raise SystemExit(f"Packaged service UTF-8 round-trip failed: {observed!r}")
          '@ | python -
      - name: Build and test frontend
        working-directory: desktop
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm run build
          npm run test:sites
          npm run test:tauri-contract
          npm run test:ui
      - name: Build Windows installer
        working-directory: desktop
        run: npm run tauri build
      - name: Install and launch packaged Windows app
        shell: pwsh
        run: ./scripts/smoke_windows_installer.ps1 -UiEvidence (Join-Path $env:RUNNER_TEMP "petrolab-at14")
      - name: Upload native acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PetroLab-Windows-AT-14-${{ github.sha }}
          path: |
            ${{ runner.temp }}/petrolab-at14/*.png
            ${{ runner.temp }}/petrolab-at14/acceptance.json
            ${{ runner.temp }}/petrolab-at14/webview-startup-failure.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Record the clean-tested MSI checksum
        shell: pwsh
        run: |
          $bundle = "desktop/src-tauri/target/release/bundle"
          $candidate = @(Get-ChildItem -LiteralPath $bundle -Recurse -File -Filter "PetroLab_*_x64_en-US.msi")
          if ($candidate.Count -ne 1) { throw "Expected exactly one candidate MSI." }
          (Get-FileHash -Algorithm SHA256 -LiteralPath $candidate[0].FullName).Hash |
            Set-Content -LiteralPath (Join-Path $bundle "candidate-msi.sha256") -Encoding ascii
      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: PetroLab-Windows-test-${{ github.sha }}
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  upgrade:
    name: Verify upgrade with the clean-tested MSI
    needs: build
    runs-on: windows-2022
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}\\src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 14b29fb0cfe7832a633059973f12a980fe7539b4
          path: historical-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: PetroLab-Windows-test-${{ github.sha }}
          path: ${{ runner.temp }}/petrolab-candidate
      - name: Verify downloaded MSI and extract the service for the baseline
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "petrolab-candidate"
          $msi = @(Get-ChildItem -LiteralPath $bundle -Recurse -File -Filter "PetroLab_*_x64_en-US.msi")
          if ($msi.Count -ne 1) { throw "Expected exactly one candidate MSI." }
          $expectedHash = (Get-Content -LiteralPath (Join-Path $bundle "candidate-msi.sha256") -Raw).Trim()
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $msi[0].FullName).Hash -ne $expectedHash) {
            throw "The downloaded MSI differs from the clean-tested installer."
          }
          $imagePath = Join-Path $env:RUNNER_TEMP "petrolab-baseline-image"
          $arguments = @("/a", ('"{0}"' -f $msi[0].FullName), ('TARGETDIR="{0}"' -f $imagePath), "/qn", "/norestart")
          $image = Start-Process -FilePath "msiexec.exe" -WindowStyle Hidden -ArgumentList $arguments -Wait -PassThru
          if ($image.ExitCode -ne 0) { throw "MSI administrative extraction failed: $($image.ExitCode)." }
          $service = @(Get-ChildItem -LiteralPath $imagePath -Recurse -File -Filter "petrolab-service.exe")
          if ($service.Count -ne 1) { throw "Expected exactly one packaged scientific service." }
          $binaries = New-Item -ItemType Directory -Force -Path "desktop/src-tauri/binaries"
          Copy-Item -LiteralPath $service[0].FullName -Destination $binaries.FullName
      - name: Prepare baseline build dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install stable --profile minimal
          rustup default stable
          python -m pip install --disable-pip-version-check .
          npm --prefix desktop ci
      - name: Build baseline MSI for upgrade rehearsal
        working-directory: desktop
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $baselineVersion = "0.1.6"
          $currentVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ([version]$currentVersion -le [version]$baselineVersion) { throw "The upgrade baseline must be older than the candidate." }
          $override = Join-Path $env:RUNNER_TEMP "PetroLab-baseline.conf.json"
          @{ version = $baselineVersion } | ConvertTo-Json -Compress | Set-Content -LiteralPath $override -Encoding utf8
          npm run tauri -- build --bundles msi --config $override
          $baseline = "src-tauri/target/release/bundle/msi/PetroLab_${baselineVersion}_x64_en-US.msi"
          Move-Item -LiteralPath $baseline -Destination (Join-Path $env:RUNNER_TEMP "PetroLab-baseline.msi")
      - name: Verify upgrade preserves the project and uninstall retains it
        shell: pwsh
        run: ./scripts/smoke_windows_installer.ps1 -BundleRoot (Join-Path $env:RUNNER_TEMP "petrolab-candidate") -BaselineMsi (Join-Path $env:RUNNER_TEMP "PetroLab-baseline.msi") -HistoricalSource historical-source

  verified-msi:
    name: Collect verified Windows MSI
    needs: [build, upgrade]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PetroLab-Windows-test-${{ github.sha }}
          path: ${{ runner.temp }}/petrolab-candidate
      - name: Record installer checksum and build identity
        shell: pwsh
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP "petrolab-candidate"
          $msi = @(Get-ChildItem -LiteralPath $candidate -Recurse -File -Filter "PetroLab_*_x64_en-US.msi")
          if ($msi.Count -ne 1) { throw "Expected exactly one candidate MSI." }
          $package = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "petrolab-verified")
          Copy-Item -LiteralPath $msi[0].FullName -Destination $package.FullName
          $installer = Join-Path $package.FullName $msi[0].Name
          $checksum = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          if ($checksum -ne (Get-Content -LiteralPath (Join-Path $candidate "candidate-msi.sha256") -Raw).Trim()) {
            throw "The MSI differs from the tested installer."
          }
          "$checksum  $($msi[0].Name)" | Set-Content -LiteralPath (Join-Path $package.FullName "SHA256SUMS.txt") -Encoding ascii
          @{
            commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            attempt = $env:GITHUB_RUN_ATTEMPT
            installer = $msi[0].Name
            sha256 = $checksum
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $package.FullName "build-info.json") -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: PetroLab-Windows-verified-MSI-${{ github.sha }}
          path: ${{ runner.temp }}/petrolab-verified/
          if-no-files-found: error
          retention-days: 14

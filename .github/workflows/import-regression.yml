name: Import regression corpus

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "fixtures/import/**"
      - "src/petrolab/import_*.py"
      - "src/petrolab/import/**"
      - "scripts/validate_real_import_corpus.py"
      - "tests/test_import_regression_corpus.py"
      - "tests/test_real_import_corpus_registry.py"
      - "tests/real_world_fixtures.py"
      - ".github/workflows/import-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate normative real-workbook registry
        run: python scripts/validate_real_import_corpus.py --manifest-only
      - name: Run import corpus contracts
        run: python -m unittest discover -s tests -p "test_*import*corpus*.py" -v

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "petrolab-desktop-v2"
version = "0.1.0"
description = "Scientific core and architecture contracts for PetroLab Desktop v2"
requires-python = ">=3.11"
dependencies = [
    "xlrd>=2.0.1,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

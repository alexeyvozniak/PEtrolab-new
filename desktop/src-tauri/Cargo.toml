[package]
name = "petrolab-desktop"
version = "0.1.3"
description = "PetroLab Desktop v2 shell"
edition = "2021"

[lib]
name = "petrolab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }
